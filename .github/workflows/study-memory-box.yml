# Temporary, on this work branch only: a free measurement for the overnight audit of 2026-11-17.
# The live Brain runs in a box with 512 MB of memory and half a processor. This builds the Brain's
# own image, gives it a box of that size, and has it answer 120 practice messages (not the frozen
# blind 60) one at a time and then four at a time, with a stand-in for the model, so it costs
# nothing. It prints how much memory the Brain holds and whether the box ran out. It reads a graph
# file from the file store and writes nothing anywhere. Removed before anything from this branch
# merges.
name: Study the memory box

on:
  push:
    branches: [claude/project-thread-a2ch07]
    paths: ['.github/workflows/study-memory-box.yml', 'study/**']

permissions:
  contents: read

jobs:
  box:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: live code, live graph, as it runs today
            ref: main
            prefix: brain-graph/
            writer: ai
            pools: ''
          - name: live code, live graph, two memory pools
            ref: main
            prefix: brain-graph/
            writer: ai
            pools: '2'
          - name: dev code, dev graph, sections writer
            ref: dev
            prefix: brain-graph-dev/
            writer: sections
            pools: ''
          - name: dev code, dev graph, sections writer, two memory pools
            ref: dev
            prefix: brain-graph-dev/
            writer: sections
            pools: '2'
          - name: dev code, dev graph, sections writer, one memory pool
            ref: dev
            prefix: brain-graph-dev/
            writer: sections
            pools: '1'
          - name: dev code, dev graph, live writer
            ref: dev
            prefix: brain-graph-dev/
            writer: ai
            pools: ''
    steps:
      - name: Checkout the Brain
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: ${{ matrix.ref }}
          path: brain

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the Brain
        run: |
          pip install --require-hashes -r brain/requirements.lock
          pip install --no-deps -e './brain[graph]'

      - name: Download the graph file (read only)
        env:
          BRAIN_GRAPH_STORE_PREFIX: ${{ matrix.prefix }}
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          python -m rockygpt_brain.retrieval.graph_sync .published
          ls -l .published
          chmod -R a+rwX .published

      - name: Checkout this branch's test script
        uses: actions/checkout@v7
        with:
          path: data

      - name: Build the Brain's own image
        run: docker build --quiet -t brain-box brain

      - name: Answer 120 practice messages in a 512 MB, half-processor box
        env:
          WRITER: ${{ matrix.writer }}
          POOLS: ${{ matrix.pools }}
          BRAIN_REF: ${{ matrix.ref }}
        run: |
          set +e
          extra=()
          if [[ -n "$POOLS" ]]; then extra=(-e "MALLOC_ARENA_MAX=$POOLS"); fi
          docker run --name box --memory=512m --memory-swap=512m --cpus=0.5 \
            -e WRITER -e BRAIN_REF -e AT_ONCE=1,4 -e LIMIT=120 -e GRAPH_DIR=/graph "${extra[@]}" \
            -v "$PWD/.published:/graph" -v "$PWD/data/study:/study:ro" \
            brain-box python /study/mem_box.py 2>&1 | grep -v '^provider_failure\|^brain_'
          docker inspect box --format 'BOX RESULT: ran out of memory {{.State.OOMKilled}}; exit code {{.State.ExitCode}}'
          exit 0

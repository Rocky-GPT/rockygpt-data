# Temporary, on this work branch only: a free measurement for the overnight audit of 2026-11-17.
# The live Brain runs in a box with 512 MB of memory and half a processor. This builds the Brain's
# own image at three commits, gives each a box of that size, and has it answer 120 practice
# messages (not the frozen blind 60) one, four and eight at a time, with a stand-in for the model,
# so it costs nothing. It prints how much memory the Brain holds and whether the box ran out. It
# reads graph files from the file store and writes nothing anywhere. Removed before anything from
# this branch merges.
name: Study the memory box

on:
  push:
    branches: [claude/project-thread-a2ch07]
    paths: ['.github/workflows/study-memory-box.yml', 'study/**']

permissions:
  contents: read

jobs:
  box:
    name: Memory box, one job, all cases
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout the Brain with the first fix only
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: 7151d570ea92e0031a03ba31f7a0dd91de1d6dd4
          path: brain-a
      - name: Checkout the Brain with both fixes
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: 3f88721ab62039391a12af3916620084f1d68a97
          path: brain-ab
      - name: Checkout the live Brain
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: main
          path: brain-main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the Brain
        run: |
          pip install --quiet --require-hashes -r brain-ab/requirements.lock
          pip install --quiet --no-deps -e './brain-ab[graph]'

      - name: Download the dev and live graph files (read only)
        env:
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          BRAIN_GRAPH_STORE_PREFIX=brain-graph-dev/ python -m rockygpt_brain.retrieval.graph_sync .graph-dev > /dev/null
          BRAIN_GRAPH_STORE_PREFIX=brain-graph/ python -m rockygpt_brain.retrieval.graph_sync .graph-live > /dev/null
          chmod -R a+rwX .graph-dev .graph-live

      - name: Checkout this branch's test script
        uses: actions/checkout@v7
        with:
          path: data

      - name: Build the Brain's own image at each commit
        run: |
          docker build --quiet -t box-a brain-a
          docker build --quiet -t box-ab brain-ab
          docker build --quiet -t box-main brain-main

      - name: Answer 120 practice messages in a 512 MB, half-processor box, case by case
        run: |
          set +e
          run_case() {  # name image graph writer
            docker rm -f box > /dev/null 2>&1
            docker run --name box --memory=512m --memory-swap=512m --cpus=0.5 \
              -e WRITER="$4" -e BRAIN_REF="$2" -e AT_ONCE=1,4,8 -e LIMIT=120 -e GRAPH_DIR=/graph \
              -v "$PWD/$3:/graph" -v "$PWD/data/study:/study:ro" \
              "$2" python /study/mem_box.py > "out-$1.txt" 2>&1
            docker inspect box --format 'BOX RESULT: ran out of memory {{.State.OOMKilled}}; exit code {{.State.ExitCode}}' >> "out-$1.txt"
          }
          run_case 1-first-fix-sections box-a .graph-dev sections
          run_case 2-both-fixes-sections box-ab .graph-dev sections
          run_case 3-both-fixes-live-writer box-ab .graph-dev ai
          run_case 4-live-code-live-graph box-main .graph-live ai
          echo "SUMMARY START"
          for f in out-*.txt; do
            echo "CASE $f"
            grep -E "^release|^after warm|^LAP|^FINISHED|^BOX RESULT" "$f" | cut -c1-330
          done
          echo "SUMMARY END"
          exit 0

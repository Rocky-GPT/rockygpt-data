# Temporary, on this work branch only: the second measurement for the overnight audit of
# 2026-11-17. The first one showed the page writer spends most of its seconds thinking before its
# first answer word. This one asks the same 30 older how-to practice questions five times with the
# sections writer as built and five times with its writer call at "low" thinking effort (and once
# with production's writer at "low"), and prints every answer whole so the two sets can be graded
# side by side later with no new spend. Nothing in the bot changes and nothing is written
# anywhere. Each job keeps its own spend cap (study/writer_tries.py); the caps add up to 82 cents.
# Removed before anything from this branch merges.
name: Study the writer tries

on:
  push:
    branches: [claude/project-thread-a2ch07]
    paths: ['.github/workflows/study-writer-tries.yml', 'study/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: sections
            tries: '5'
            cap: '0.40'
          - arm: sections-low
            tries: '5'
            cap: '0.30'
          - arm: ai-low
            tries: '1'
            cap: '0.12'
    steps:
      - name: Checkout the Brain
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: dev
          path: brain

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the Brain
        run: |
          pip install --require-hashes -r brain/requirements.lock
          pip install --no-deps -e './brain[graph]'

      - name: Download the dev graph
        env:
          BRAIN_GRAPH_STORE_PREFIX: brain-graph-dev/
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: python -m rockygpt_brain.retrieval.graph_sync .published

      - name: Checkout this branch's test script
        uses: actions/checkout@v7
        with:
          path: data

      - name: Ask the 30 practice questions and print every answer
        env:
          BRAIN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY: '0'
          ARMS: ${{ matrix.arm }}
          TRIES: ${{ matrix.tries }}
          CAP_USD: ${{ matrix.cap }}
        run: python data/study/writer_tries.py 2>&1 | grep -v '^provider_failure\|^brain_'

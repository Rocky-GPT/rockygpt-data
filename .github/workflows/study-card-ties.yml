# Temporary, on this work branch only: asks why two answer cards tie for a practice question, and
# what counting near-copies of one task as one would change. It reads the dev graph's own vectors
# and writes nothing. Its one paid call embeds 90 short practice questions (about a hundredth of a
# cent). Removed before this branch merges.
name: Study why two answer cards tie for a question

on:
  push:
    branches: [claude/project-thread-gsatn5]
    paths: ['.github/workflows/study-card-ties.yml', 'study/**']

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the Brain
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: dev
          path: brain

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the Brain
        run: |
          pip install --require-hashes -r brain/requirements.lock
          pip install --no-deps -e './brain[graph]'

      - name: Download the dev graph
        env:
          BRAIN_GRAPH_STORE_PREFIX: brain-graph-dev/
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: python -m rockygpt_brain.retrieval.graph_sync .published

      - name: Checkout this branch's study script
        uses: actions/checkout@v7
        with:
          path: data

      # Read only (this action never saves): the words of the questions the build wrote for each
      # task, so a fire can be judged by reading.
      - name: Restore the build's question cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .meaning-cache
          key: study-never-saved-${{ github.run_id }}
          restore-keys: |
            dev-meaning-cache-
            meaning-cache-

      - name: Measure the ties
        env:
          BRAIN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python data/study/why_cards_tie.py

# One-off (tools review 11-18): why the new Brain answers "who plans the big events..." with an
# events list. Shows each Brain's read for a few questions. Removed after it runs.
name: Probe the read, old vs new
on:
  push:
    branches: [claude/project-thread-uhq1n6]
    paths: [.github/workflows/probe-reads.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ledger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ledger"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OLD_REF: dev
      NEW_REF: claude/project-thread-uhq1n6
      MAX_USD: '0.10'
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
    steps:
      - name: Checkout the old Brain
        uses: actions/checkout@v7
        with: { repository: Rocky-GPT/rockygpt-brain, ref: '${{ env.OLD_REF }}', path: brain-old }
      - name: Checkout the new Brain
        uses: actions/checkout@v7
        with: { repository: Rocky-GPT/rockygpt-brain, ref: '${{ env.NEW_REF }}', path: brain-new }

      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }

      - name: Install both Brains, each in its own environment
        run: |
          for side in old new; do
            python -m venv "venv-$side"
            "venv-$side/bin/pip" install --quiet --require-hashes -r "brain-$side/requirements.lock"
            "venv-$side/bin/pip" install --quiet --no-deps -e "./brain-$side[graph]"
          done

      - name: Download the live graph (read only), one copy for each Brain
        env:
          BRAIN_GRAPH_STORE_PREFIX: brain-graph/
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          venv-new/bin/python -m rockygpt_brain.retrieval.graph_sync graph-new > /dev/null
          cp -r graph-new graph-old

      - name: Make a throwaway spending ledger, capped at max_usd
        run: |
          admin=postgresql://postgres@127.0.0.1:5432/ledger
          for file in brain-new/migrations/*.sql; do psql -q -v ON_ERROR_STOP=1 "$admin" -f "$file"; done
          cap=$(python -c "import os; print(int(float(os.environ['MAX_USD']) * 1_000_000_000))")
          psql -q -v ON_ERROR_STOP=1 "$admin" <<SQL
          UPDATE brain_ops.accounts SET cap_nusd = $cap WHERE environment = 'development';
          CREATE ROLE ci_brain LOGIN PASSWORD 'ci';
          GRANT brain_development TO ci_brain;
          SQL

      - name: Start both Brains
        env:
          BRAIN_ENVIRONMENT: development
          BRAIN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRAIN_LEDGER_DATABASE_URL: postgresql://ci_brain:ci@127.0.0.1:5432/ledger
        run: |
          # Production's pinned settings (rockygpt-infra config/environment-sync.json), minus the
          # file store: each Brain reads its own downloaded copy and never follows a new release.
          export BRAIN_OPENAI_PROJECT=proj_aMhXgndK2e9EUQZpXbLFh4yV BRAIN_OUTPUT=written \
            BRAIN_HOWTO_ONE_CALL=1 BRAIN_OPENAI_DECIDE_EFFORT=low BRAIN_WRITER_MAX_OUTPUT_TOKENS=6000 \
            BRAIN_OPENAI_EMBED_MODEL=text-embedding-3-large BRAIN_OPENAI_EMBED_INPUT_NUSD_PER_TOKEN=130 \
            BRAIN_OPENAI_EMBED_PRICE_VALID_UNTIL=2026-12-25T00:00:00+00:00
          port=8101
          for side in old new; do
            (cd "brain-$side" && BRAIN_GRAPH_ONLY_DIR="$GITHUB_WORKSPACE/graph-$side" \
              nohup "$GITHUB_WORKSPACE/venv-$side/bin/uvicorn" rockygpt_brain.api.app:app \
              --host 127.0.0.1 --port "$port" > "$GITHUB_WORKSPACE/brain-$side.log" 2>&1 &)
            echo "$(echo "$side" | tr a-z A-Z)_BRAIN_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
            port=$((port + 1))
          done
          for port in 8101 8102; do
            for i in $(seq 1 90); do
              curl -fsS "http://127.0.0.1:$port/readiness" > /dev/null 2>&1 && break
              sleep 2
            done
            curl -fsS "http://127.0.0.1:$port/readiness" || { tail -40 brain-*.log; exit 1; }
            echo
          done

      - name: Ask each question 4 times on each Brain and show the read
        run: |
          python - <<'PY'
          import json, urllib.request
          QUESTIONS = [
              "who plans the big events like comedy nights n concerts? i wanna join whatever board does that fr",
              "how do i join the college programming board",
              "whats going on next mon and tues before everyone leaves for thanksgiving break",
          ]
          for side, port in (("old", 8101), ("new", 8102)):
              for q in QUESTIONS:
                  for n in range(4):
                      req = urllib.request.Request(
                          f"http://127.0.0.1:{port}/v1/chat",
                          data=json.dumps({"messages": [{"role": "user", "content": q}]}).encode(),
                          headers={"Content-Type": "application/json", "x-rockygpt-diagnostics": "1"})
                      body = json.load(urllib.request.urlopen(req, timeout=120))
                      m = body.get("metrics") or {}
                      read = m.get("read") or {}
                      print(f"{side} | {q[:40]} | try {n + 1} | decidedBy={m.get('decidedBy')} "
                            f"| topic={read.get('topic')} | question={read.get('question')!r} "
                            f"| time={read.get('time')} | answer={' '.join(str(body.get('answer')).split())[:120]!r}")
          PY
          psql -At postgresql://postgres@127.0.0.1:5432/ledger -c "SELECT 'Brains spent $' || round(coalesce(sum(cost_nusd),0)/1e9, 4) FROM brain_ops.operations" || true

# Temporary, on this work branch only (2026-11-17): the catalog policies collector has failed
# for six nights and the run log cuts its error. This runs it once and prints the whole error and
# the shape of the pages it reads. Free: two page requests, no model calls. Removed before merge.
name: Study catalog policies failure

on:
  push:
    branches: [claude/project-thread-n73jiu]
    paths: ['.github/workflows/study-catalog.yml', 'study6/catalog_shape.mjs', 'study6/catalog_api.sh', 'study6/catalog_render.mjs']

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --silent
      - name: Run the collector
        continue-on-error: true
        run: npm run fetch:catalog-policies 2>&1 | tail -40
      - run: npx playwright install chromium
      - name: The policies page as a browser shows it
        run: node study6/catalog_render.mjs

# Temporary, on this work branch only (2026-11-17): audit item 7. The Brain branch with the
# streamed route answers 10 practice questions over HTTP with the student site's stream header,
# against the live graph (read only), capped at $0.05. Removed before anything here merges.
name: Study streamed answers

on:
  push:
    branches: [claude/project-thread-n73jiu]
    paths: ['.github/workflows/study-stream.yml', 'study6/stream.py']

permissions:
  contents: read

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: claude/project-thread-n73jiu
          path: brain
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: |
          pip install --quiet --require-hashes -r brain/requirements.lock
          pip install --quiet --no-deps -e './brain[graph]'
      - name: Download the live graph (read only)
        env:
          BRAIN_GRAPH_STORE_PREFIX: brain-graph/
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: python -m rockygpt_brain.retrieval.graph_sync .published > /dev/null
      - uses: actions/checkout@v7
        with:
          path: data
      - name: Ask 10 questions as the student site does
        env:
          BRAIN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CAP_USD: '0.05'
        run: python data/study6/stream.py 2>&1 | grep -v '^provider_failure\|^brain_\|^INFO'

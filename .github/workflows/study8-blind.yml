# Temporary, on this work branch only: the blind 60 run for audit plan item 8 (2026-11-17),
# approved with the whole plan. Production's Brain (main, writer "direct") and the Brain branch
# where the read's topic picks the path each answer the frozen blind set once against the live
# graph file (read only), two at a time, capped at $0.40 a job. Removed before any merge.
name: Study 8 blind 60, live vs read path

on:
  push:
    branches: [claude/project-thread-ywfxp0]
    paths: ['.github/workflows/study8-blind.yml', 'study8/blind.py']

permissions:
  contents: write

concurrency:
  group: study8-blind
  cancel-in-progress: false

jobs:
  ask:
    name: Blind 60 (${{ matrix.arm }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: live
            ref: main
          - arm: read
            ref: 17b477b5063e779ce0ad062d387e77efed558c56
    steps:
      - name: Checkout the Brain
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: ${{ matrix.ref }}
          path: brain
          fetch-depth: 0

      - name: Checkout the frozen blind set
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-evals
          ref: dev
          path: evals
          sparse-checkout: tonight-2026-11-02/blind-four-areas

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the Brain
        run: |
          pip install --quiet --require-hashes -r brain/requirements.lock
          pip install --quiet --no-deps -e './brain[graph]'

      - name: Download the live graph (read only)
        env:
          BRAIN_GRAPH_STORE_PREFIX: brain-graph/
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: python -m rockygpt_brain.retrieval.graph_sync .published > /dev/null

      - name: Checkout this branch's test script
        uses: actions/checkout@v7
        with:
          path: data

      - name: Ask the 60 questions once
        env:
          BRAIN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY: '0'
          CAP_USD: '0.40'
          ARMS: ${{ matrix.arm }}
          TRIES: '1'
          AT_ONCE: '2'
          ROWS: '0'
          QUESTIONS: ${{ github.workspace }}/evals/tonight-2026-11-02/blind-four-areas/questions-frozen.json
          OUT: ${{ github.workspace }}/blind-${{ matrix.arm }}.json
        run: set -o pipefail; python data/study8/blind.py 2>&1 | grep -v '^provider_failure\|^brain_'

      - name: Commit the rows to this branch
        run: |
          cd data
          mkdir -p study8/results
          cp "$GITHUB_WORKSPACE/blind-${{ matrix.arm }}.json" study8/results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add study8/results
          git commit -m "Study rows: blind ${{ matrix.arm }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/project-thread-ywfxp0 && git push origin HEAD:claude/project-thread-ywfxp0 && break
            sleep $((i * 5))
          done

# Temporary, on this work branch only (2026-11-17): runs the fixed catalog policies collector once
# and prints what it saved. Free: one page request and one browser visit, no model calls.
# Removed before merge.
name: Study catalog policies failure

on:
  push:
    branches: [claude/project-thread-n73jiu]
    paths: ['.github/workflows/study-catalog.yml', 'ingestion/catalog-policies.ts']

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --silent
      - run: npx playwright install chromium
      - name: Run the fixed collector
        run: npm run fetch:catalog-policies 2>&1 | tail -20
      - name: What it saved
        run: |
          node -e '
            const c = require("./data/raw/catalog-policies.raw.json");
            console.log("policies", c.policies.length, "published", c.page.publishedAt, "index text", c.index.text.length);
            for (const p of c.policies.slice(0, 5)) console.log(" ", p.anchor, p.name, p.content.length);
            const s = require("./data/raw/catalog-policies-sources.raw.json");
            for (const p of s.pages) console.log("source", p.url, p.html.length);
          '
          npx tsx -e '
            import { catalogPolicyPages } from "./src/data-v2/catalog-policies";
            const rows = catalogPolicyPages(require("./data/raw/catalog-policies.raw.json"));
            console.log("rows", rows.length, rows[0].url, rows[0].key, rows[0].sections.length);
          '

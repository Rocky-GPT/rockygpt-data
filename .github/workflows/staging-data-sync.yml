name: Staging Data Sync
on:
  schedule:
    - cron: '25 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with: { ref: staging }
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Apply the current schema to the independent staging database
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run data:schema
      - name: Copy only allowlisted public campus data into staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SOURCE_DATABASE_URL: ${{ secrets.STAGING_SOURCE_DATABASE_URL }}
          ALLOW_STAGING_DATABASE_RESET: '1'
        run: npm run staging:sync-public
      - name: Verify the synced staging release
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run staging:verify-public

# Temporary, on this work branch only: the paid practice run for audit plan item 6 (2026-11-17),
# capped at $0.25 a job. Production's Brain (main, writer "ai") and the Brain branch with the new
# "direct" writer each answer the 30 older practice questions twice against the live graph file
# (read only). The rows are committed to this branch for grading. Removed before anything from
# this branch merges.
name: Study practice run, live vs direct

on:
  push:
    branches: [claude/project-thread-n73jiu]
    paths: ['.github/workflows/study-practice.yml', 'study6/practice.py']

permissions:
  contents: write

concurrency:
  group: study-practice
  cancel-in-progress: false

jobs:
  ask:
    name: Practice questions (${{ matrix.arm }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: live
            ref: main
    steps:
      - name: Checkout the Brain
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: ${{ matrix.ref }}
          path: brain
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the Brain
        run: |
          pip install --quiet --require-hashes -r brain/requirements.lock
          pip install --quiet --no-deps -e './brain[graph]'

      - name: Download the live graph (read only)
        env:
          BRAIN_GRAPH_STORE_PREFIX: brain-graph/
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: python -m rockygpt_brain.retrieval.graph_sync .published > /dev/null

      - name: Checkout this branch's test script
        uses: actions/checkout@v7
        with:
          path: data

      - name: Ask the 30 questions twice
        env:
          BRAIN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY: '0'
          CAP_USD: '0.25'
          ARMS: ${{ matrix.arm }}
          TRIES: '2'
          ROWS: '0'
          OUT: ${{ github.workspace }}/rows-${{ matrix.arm }}.json
        run: set -o pipefail; python data/study6/practice.py 2>&1 | grep -v '^provider_failure\|^brain_'

      - name: Commit the rows to this branch
        run: |
          cd data
          mkdir -p study6/results
          cp "$GITHUB_WORKSPACE/rows-${{ matrix.arm }}.json" study6/results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add study6/results
          git commit -m "Study rows: ${{ matrix.arm }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/project-thread-n73jiu && git push origin HEAD:claude/project-thread-n73jiu && break
            sleep $((i * 5))
          done

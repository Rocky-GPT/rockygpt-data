# TEMPORARY, this branch only: removed before the branch merges. The owner added credit on
# 2026-11-11 after the account ran out (every call answered HTTP 429, insufficient_quota).
# This asks for one embedding and one short reply to see that both work again, and
# prints the status and the service's own limits. It prints no key and no account name.
name: Check the model service answers

on:
  push:
    branches: [claude/project-thread-gsatn5]
    paths: ['.github/workflows/check-model-service.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask for one embedding and one short reply
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ask() {
            local name="$1" path="$2" body="$3" status
            status="$(curl -sS -o reply.json -D headers.txt -w '%{http_code}' "https://api.openai.com/v1/$path" \
              -H "authorization: Bearer $OPENAI_API_KEY" -H 'content-type: application/json' -d "$body")"
            echo "$name: HTTP $status"
            jq -c '{error_type: .error.type, error_code: .error.code, usage: .usage}' reply.json || true
            grep -i -E '^(x-ratelimit-[a-z-]+|retry-after):' headers.txt || echo '(no limit headers)'
          }
          ask embeddings embeddings '{"model":"text-embedding-3-large","input":["hello"],"dimensions":512}'
          ask luna responses '{"model":"gpt-6-luna","store":false,"max_output_tokens":16,"input":"Say ok."}'

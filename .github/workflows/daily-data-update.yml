name: Daily Data Update

# One workflow, two targets.
#
# production: main's code collects what is stale from Ramapo's sites, publishes to the campus
#   database (Neon), builds the release graph and shares it under brain-graph/, which the live
#   Brain follows.
# dev: dev's code (data dev + Brain dev) rebuilds from the pages production captured last, with
#   no download from Ramapo's sites, in a throwaway database inside the runner (never Neon), and
#   shares the graph under brain-graph-dev/, which only the laptop reads
#   (`./run-local.sh sync-dev`). It runs on every push to data dev, and hourly when Brain dev
#   has moved since the last dev build. It catches a build problem before a release.
on:
  schedule:
    # Every day at 10:41 UTC (5:41 AM EST / 6:41 AM EDT). GitHub starts scheduled runs late,
    # worst at the top of the hour: at '0 11' they began 3 to 6 hours late (10-21..11-01).
    - cron: '41 10 * * *'
    # Dev graph: hourly check; builds only when data dev or Brain dev moved since the last one.
    - cron: '17 * * * *'
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      target:
        description: 'production (main, Neon, brain-graph/) or dev (dev code, runner database, brain-graph-dev/)'
        type: choice
        options: [production, dev]
        default: production

permissions:
  contents: read
  issues: write

# A dev build never waits behind, or holds up, the production run; a newer dev push replaces an
# older dev build still running.
concurrency:
  group: ${{ (github.event_name == 'push' || github.event.schedule == '17 * * * *' || inputs.target == 'dev') && 'daily-data-update-dev' || 'daily-data-update' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event.schedule == '17 * * * *' || inputs.target == 'dev' }}

env:
  DEV_GRAPH_PREFIX: brain-graph-dev/
  # The runner's own throwaway database for a dev build (a container on 127.0.0.1).
  DEV_DATABASE_URL: postgresql://postgres:dev-build@127.0.0.1:5432/campus

jobs:
  # Which target this run builds, from which commits, and whether there is anything new to build.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.plan.outputs.target }}
      build: ${{ steps.plan.outputs.build }}
      data_ref: ${{ steps.plan.outputs.data_ref }}
      brain_ref: ${{ steps.plan.outputs.brain_ref }}
    steps:
      - name: Decide the target and the commits to build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.RAW_ARTIFACT_REGION || 'auto' }}
          BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
        run: |
          if [[ "$EVENT" == push || "$SCHEDULE" == '17 * * * *' || "$INPUT_TARGET" == dev ]]; then
            target=dev
          else
            target=production
          fi
          if [[ "$target" == production ]]; then
            { echo target=production; echo build=true
              echo "data_ref=$GITHUB_SHA"; echo brain_ref=main; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          data_ref="$(gh api repos/Rocky-GPT/rockygpt-data/commits/dev --jq .sha)"
          brain_ref="$(gh api repos/Rocky-GPT/rockygpt-brain/commits/dev --jq .sha)"
          build=true
          if [[ "$EVENT" == schedule ]]; then
            # The hourly check builds only when a dev branch moved since the dev graph last shared.
            last="$(aws s3 cp "s3://$BUCKET/${DEV_GRAPH_PREFIX}active.json" - --endpoint-url "$ENDPOINT" 2>/dev/null \
              | jq -r '[.build.data_commit // "", .build.brain_commit // ""] | join(" ")' || true)"
            if [[ "$last" == "$data_ref $brain_ref" ]]; then
              build=false
              echo "The dev graph already has data dev ${data_ref:0:7} and Brain dev ${brain_ref:0:7}; nothing to build."
            fi
          fi
          echo "Target dev: data dev ${data_ref:0:7}, Brain dev ${brain_ref:0:7}, build=$build."
          { echo target=dev; echo "build=$build"
            echo "data_ref=$data_ref"; echo "brain_ref=$brain_ref"; } >> "$GITHUB_OUTPUT"

  update-data:
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ needs.plan.outputs.target }}
    # A clean checkout has no provenance sidecars, so the first run may need
    # the full catalog crawl. Later runs refresh only stale/unknown sources.
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.data_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: ${{ env.TARGET == 'production' }}
        run: npx playwright install chromium

      # The last publish's own copy of the release it uploaded. The refresh below restores the
      # active release from it wherever the database's content hashes match, instead of
      # downloading the whole release from Neon (free plan: 5 GB of transfer a month).
      - name: Restore the last published release's files
        uses: actions/cache/restore@v4
        with:
          path: .release-snapshot
          key: release-snapshot-${{ github.run_id }}
          restore-keys: release-snapshot-

      - name: Refresh stale publication sources and rebuild derived data
        if: ${{ env.TARGET == 'production' }}
        env:
          ARCHWAY_USERNAME: ${{ secrets.ARCHWAY_USERNAME }}
          ARCHWAY_PASSWORD: ${{ secrets.ARCHWAY_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAW_ARTIFACT_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          RAW_ARTIFACT_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          RAW_ARTIFACT_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          RAW_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          RAW_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
          RAW_ARTIFACT_REQUIRED: '1'
        run: npm run refresh:publishable

      # Dev build: production's newest captured pages, this checkout's code, a database that lives
      # and dies with this runner. Neon is only read (which pages the active release holds; the
      # saved copy above covers the rest), and nothing is downloaded from Ramapo's sites.
      - name: Start the dev build's throwaway database
        if: ${{ env.TARGET == 'dev' }}
        run: |
          docker run -d --name campus-db -e POSTGRES_PASSWORD=dev-build -e POSTGRES_DB=campus \
            -p 127.0.0.1:5432:5432 postgres:17
          for _ in $(seq 60); do docker exec campus-db pg_isready -U postgres -d campus -q && break; sleep 1; done
          docker exec campus-db pg_isready -U postgres -d campus

      - name: Restore production's captured pages and rebuild derived data with dev's code
        if: ${{ env.TARGET == 'dev' }}
        env:
          ROCKYGPT_BUILD_TARGET: dev
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAW_ARTIFACT_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          RAW_ARTIFACT_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          RAW_ARTIFACT_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          RAW_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          RAW_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: npm run refresh:publishable -- --from-captured-pages

      # Data owns deterministic collector, validity, contract, and HTTP
      # regression tests. Model-answer accuracy remains in rockygpt-evals.
      - name: Run deterministic data-service tests
        run: npm test

      # The dev build's publish runs these same gates, except the age check (its pages are
      # production's last capture, possibly a little past a freshness window).
      - name: Run data quality gates
        if: ${{ env.TARGET == 'production' }}
        run: npm run data:quality

      - name: Atomically publish verified dataset
        if: ${{ env.TARGET == 'production' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBEDDING_MODEL: ${{ vars.OPENAI_EMBEDDING_MODEL || 'text-embedding-3-small' }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          RAW_ARTIFACT_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          RAW_ARTIFACT_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          RAW_ARTIFACT_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          RAW_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          RAW_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
          RAW_ARTIFACT_REQUIRED: '1'
        run: npm run data:publish

      # No bucket and no Neon: the switch below refuses any database but the runner's own.
      - name: Publish the dev dataset into the throwaway database
        if: ${{ env.TARGET == 'dev' }}
        env:
          ROCKYGPT_BUILD_TARGET: dev
          ROCKYGPT_TEST_BUILD_FROM_CAPTURED_PAGES: '1'
          DATABASE_URL: ${{ env.DEV_DATABASE_URL }}
          SOURCE_COMMIT_SHA: ${{ needs.plan.outputs.data_ref }}
        run: npm run data:publish

      - name: Hand the dev database to the graph job
        if: ${{ env.TARGET == 'dev' }}
        run: docker exec campus-db pg_dump -U postgres -d campus -Fc > campus-dev.dump && ls -lh campus-dev.dump

      - name: Upload the dev database
        if: ${{ env.TARGET == 'dev' }}
        uses: actions/upload-artifact@v4
        with:
          name: campus-dev-database
          path: campus-dev.dump
          retention-days: 1

      - name: Keep this release's files for the next refresh
        if: ${{ env.TARGET == 'production' && hashFiles('.release-snapshot/release.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .release-snapshot
          key: release-snapshot-${{ github.run_id }}

      # A release now holds about 21,700 document chunks, so a week of daily
      # publishes between Sunday cleanups can outgrow the free database's
      # 0.5 GB, and a full database also stops the Brain's budget ledger.
      # Prune right after each publish so the database keeps the active
      # release and the newest retired one, drops failed publishes at once and
      # trims settled Brain ledger rows past 60 days; the log shows its size.
      - name: Remove retired datasets beyond the rollback window
        if: ${{ env.TARGET == 'production' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run maintenance:data-retention

      # After publishing, Jev labels the office and school pages that are new, changed or a
      # month past their last check, and flagged pages wait in an issue for a person. A
      # flagged page stays published until its skippedPages line is added. Without the
      # TYPESAFE_API_KEY secret nothing is sent; a run spends at most PAGE_CHECK_MAX_USD
      # (default $1).
      - name: Restore page check verdicts
        if: ${{ env.TARGET == 'production' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: data/review/page-check-verdicts.json
          key: page-check-${{ github.run_id }}
          restore-keys: page-check-

      - name: Check new and changed pages with Jev
        if: ${{ env.TARGET == 'production' }}
        continue-on-error: true
        timeout-minutes: 45
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PAGE_CHECK_MAX_USD: ${{ vars.PAGE_CHECK_MAX_USD }}
        run: npm run check:pages

      - name: Save page check verdicts
        if: ${{ env.TARGET == 'production' && hashFiles('data/review/page-check-verdicts.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/review/page-check-verdicts.json
          key: page-check-${{ github.run_id }}

      - name: List flagged pages for review
        if: ${{ env.TARGET == 'production' && hashFiles('data/review/page-check.json') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          title='[Page check] Pages to review'
          issue_number="$(
            gh issue list \
              --repo "$REPOSITORY" \
              --state open \
              --label page-review \
              --limit 100 \
              --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" \
              | head -n 1
          )"
          flagged="$(jq '.flagged | length' data/review/page-check.json)"
          unjudged="$(jq '.unjudged' data/review/page-check.json)"
          if [[ "$flagged" == 0 ]]; then
            # Close only when every page has a verdict; missing verdicts are not a clean list.
            if [[ -n "$issue_number" && "$unjudged" == 0 ]]; then
              gh issue close "$issue_number" \
                --repo "$REPOSITORY" \
                --reason completed \
                --comment 'Every flagged page has been reviewed.'
            fi
            exit 0
          fi
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --repo "$REPOSITORY" --body-file data/review/page-check.md
          else
            gh label create page-review \
              --repo "$REPOSITORY" \
              --color FBCA04 \
              --description "Scraped pages Jev flagged for a person to review" \
              --force
            gh issue create \
              --repo "$REPOSITORY" \
              --title "$title" \
              --label page-review \
              --body-file data/review/page-check.md
          fi

      - name: Resolve or update data refresh incident
        if: ${{ success() && env.TARGET == 'production' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          incident_number="$(
            gh issue list \
              --repo "$REPOSITORY" \
              --state open \
              --label data-refresh \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "[Data Refresh] Daily refresh failing") | .number' \
              | head -n 1
          )"
          # Published, but some source kept the active release's copy or some reviewed topic was
          # withheld because its page changed: the incident stays open with the reasons.
          reports=()
          for report in data/review/refresh-kept-sources.md data/review/refresh-withheld-topics.md; do
            if [[ -f "$report" ]]; then reports+=("$report"); fi
          done
          if (( ${#reports[@]} )); then
            kept_body="$(printf '@%s Published, but some data needs review.\n\n- Run: %s\n\n%s' \
              "$REPOSITORY_OWNER" "$RUN_URL" "$(cat "${reports[@]}")")"
            gh label create data-refresh \
              --repo "$REPOSITORY" \
              --color B60205 \
              --description "Automated data collection or publication incident" \
              --force
            if [[ -n "$incident_number" ]]; then
              gh issue comment "$incident_number" --repo "$REPOSITORY" --body "$kept_body"
            else
              gh issue create \
                --repo "$REPOSITORY" \
                --title "[Data Refresh] Daily refresh failing" \
                --label data-refresh \
                --body "$kept_body"
            fi
            exit 0
          fi
          if [[ -z "$incident_number" ]]; then
            exit 0
          fi
          recovery_body="$(
            printf 'The scheduled data refresh recovered successfully.\n\n- Successful run: %s\n- Recovered at: %s' \
              "$RUN_URL" \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          )"
          gh issue close "$incident_number" \
            --repo "$REPOSITORY" \
            --reason completed \
            --comment "$recovery_body"

      # A failed dev build shows as a red run on dev, not as a production incident.
      - name: Report data refresh failure
        if: ${{ failure() && env.TARGET == 'production' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER: ${{ github.event_name }}
        run: |
          gh label create data-refresh \
            --repo "$REPOSITORY" \
            --color B60205 \
            --description "Automated data collection or publication incident" \
            --force
          incident_number="$(
            gh issue list \
              --repo "$REPOSITORY" \
              --state open \
              --label data-refresh \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "[Data Refresh] Daily refresh failing") | .number' \
              | head -n 1
          )"
          incident_body="$(
            printf '@%s The scheduled RockyGPT data refresh failed or rejected stale/incomplete data.\n\n- Failed run: %s\n- Commit: `%s`\n- Trigger: `%s`\n- Observed at: %s\n\nThe previous active dataset remains available. Review the linked workflow logs before retrying or changing collection thresholds.' \
              "$REPOSITORY_OWNER" \
              "$RUN_URL" \
              "$COMMIT_SHA" \
              "$TRIGGER" \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          )"
          if [[ -n "$incident_number" ]]; then
            gh issue comment "$incident_number" \
              --repo "$REPOSITORY" \
              --body "$incident_body"
          else
            gh issue create \
              --repo "$REPOSITORY" \
              --title "[Data Refresh] Daily refresh failing" \
              --label data-refresh \
              --body "$incident_body"
          fi

      # Last, so the counts sit at the end of the log: which collectors ran, and how many pages
      # each reused (unchanged since the last capture) instead of downloading from Ramapo's sites.
      - name: Show what was read from Ramapo's sites
        if: ${{ always() }}
        continue-on-error: true
        run: cat data/review/site-downloads.txt 2>/dev/null || echo 'No collector wrote a download note.'

  # The Brain finds programs, courses, people, events and how-to sections by meaning only with
  # the active release's meaning index. Built from whichever release is active, so it runs even
  # when today's refresh failed and an older release still serves; texts unchanged since the last
  # run are not embedded again (the cache is kept between runs).
  # A dev build goes on only when its dataset built: there is no older dev release to fall back on.
  meaning-index:
    needs: [plan, update-data]
    if: ${{ always() && needs.plan.outputs.build == 'true' && (needs.plan.outputs.target == 'production' || needs.update-data.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET: ${{ needs.plan.outputs.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.data_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply the database schema (adds the index table, migration 034)
        if: ${{ env.TARGET == 'production' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run data:schema

      - name: Start the dev build's throwaway database
        if: ${{ env.TARGET == 'dev' }}
        run: |
          docker run -d --name campus-db -e POSTGRES_PASSWORD=dev-build -e POSTGRES_DB=campus \
            -p 127.0.0.1:5432:5432 postgres:17
          for _ in $(seq 60); do docker exec campus-db pg_isready -U postgres -d campus -q && break; sleep 1; done
          docker exec campus-db pg_isready -U postgres -d campus

      - name: Download the dev database
        if: ${{ env.TARGET == 'dev' }}
        uses: actions/download-artifact@v4
        with:
          name: campus-dev-database

      - name: Load the dev database
        if: ${{ env.TARGET == 'dev' }}
        run: docker exec -i campus-db pg_restore -U postgres -d campus --no-owner < campus-dev.dump

      - name: Checkout the Brain
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: ${{ needs.plan.outputs.brain_ref }}
          path: brain

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Production's exact packages (the Brain's Dockerfile and CI install the same lock).
      - name: Install the Brain
        run: |
          pip install --require-hashes -r brain/requirements.lock
          pip install --no-deps -e './brain[graph]'

      # Production's cache never takes in dev's entries; a dev build starts from production's.
      - name: Restore the embedding and question caches
        uses: actions/cache/restore@v4
        with:
          path: .meaning-cache
          key: ${{ env.TARGET == 'dev' && 'dev-' || '' }}meaning-cache-${{ github.run_id }}
          restore-keys: |
            ${{ env.TARGET == 'dev' && 'dev-meaning-cache-' || 'meaning-cache-' }}
            meaning-cache-

      - name: Build the release graph from the campus database
        env:
          DATABASE_URL: ${{ env.TARGET == 'dev' && env.DEV_DATABASE_URL || secrets.DATABASE_URL }}
        run: python brain/scripts/build_graph.py --out .published --read-seconds 900

      - name: Build the meaning index
        env:
          BRAIN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python brain/scripts/build_meaning_index.py --dir .published --cache .meaning-cache

      # Every office and venue card, looked up the ways a student asks, must read as the Brain's
      # plain sentences (brain/scripts/check_plain_writer.py). A card shape it can't say reaches
      # students as code's evidence text with notes like "captured 2026-10-23T14:20" (11-03: the
      # gym's hours). The check flags it for a Brain fix and the release still goes out: a day's
      # data is never held back by wording.
      - name: Check every card reads as plain sentences
        if: ${{ hashFiles('brain/scripts/check_plain_writer.py') != '' }}
        continue-on-error: true
        run: python brain/scripts/check_plain_writer.py .published

      - name: Save the embedding and question caches
        if: ${{ always() && hashFiles('.meaning-cache/questions.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .meaning-cache
          key: ${{ env.TARGET == 'dev' && 'dev-' || '' }}meaning-cache-${{ github.run_id }}

      - name: Store the index beside the release
        if: ${{ env.TARGET == 'production' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # The URL asks Neon for full certificate checks (sslmode=verify-full), and psycopg looks
        # for ~/.postgresql/root.crt, which a runner lacks. Trust the same roots the Brain's own
        # connections use (certifi; retrieval/postgres.py), as the graph step above already does.
        run: |
          PGSSLROOTCERT="$(python -c 'import certifi; print(certifi.where())')" \
            python brain/scripts/publish_meaning_index.py --dir .published

      # Production's Brain and the laptop's serve this one copy: the release graph file and its
      # meaning index go to the file store (brain-graph/ in the raw-archive bucket), the pointer
      # last. Production's Brain checks for it every 5 minutes; the laptop downloads it when Dan
      # syncs (rockygpt-brain retrieval/graph_sync.py). Neither reads the campus database to answer.
      # The dev graph's pointer says what it was built from: the laptop shows it, and the hourly
      # check compares it with the dev branches.
      - name: Mark the dev graph with the commits it was built from
        if: ${{ env.TARGET == 'dev' }}
        env:
          DATA_COMMIT: ${{ needs.plan.outputs.data_ref }}
          BRAIN_COMMIT: ${{ needs.plan.outputs.brain_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq --arg d "$DATA_COMMIT" --arg b "$BRAIN_COMMIT" --arg r "$RUN_URL" \
            '. + {build: {target: "dev", data_commit: $d, brain_commit: $b, run: $r}}' \
            .published/active.json > .published/active.json.new
          mv .published/active.json.new .published/active.json

      - name: Share the release graph with every Brain
        env:
          # dev never writes production's folder: the Brain's live copy is brain-graph/.
          BRAIN_GRAPH_STORE_PREFIX: ${{ env.TARGET == 'dev' && env.DEV_GRAPH_PREFIX || 'brain-graph/' }}
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          if [[ "$TARGET" == dev && "$BRAIN_GRAPH_STORE_PREFIX" != "$DEV_GRAPH_PREFIX" ]]; then
            echo "A dev build shares only under $DEV_GRAPH_PREFIX." >&2; exit 1
          fi
          python brain/scripts/publish_graph.py --dir .published

name: Daily Data Update

on:
  schedule:
    # Run every day at 11:00 UTC (6 AM EST / 7 AM EDT).
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    # A clean checkout has no provenance sidecars, so the first run may need
    # the full catalog crawl. Later runs refresh only stale/unknown sources.
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Refresh stale publication sources and rebuild derived data
        env:
          ARCHWAY_USERNAME: ${{ secrets.ARCHWAY_USERNAME }}
          ARCHWAY_PASSWORD: ${{ secrets.ARCHWAY_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAW_ARTIFACT_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          RAW_ARTIFACT_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          RAW_ARTIFACT_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          RAW_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          RAW_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
          RAW_ARTIFACT_REQUIRED: '1'
        run: npm run refresh:publishable

      # Data owns deterministic collector, validity, contract, and HTTP
      # regression tests. Model-answer accuracy remains in rockygpt-evals.
      - name: Run deterministic data-service tests
        run: npm test

      - name: Run data quality gates
        run: npm run data:quality

      - name: Atomically publish verified dataset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBEDDING_MODEL: ${{ vars.OPENAI_EMBEDDING_MODEL || 'text-embedding-3-small' }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          RAW_ARTIFACT_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          RAW_ARTIFACT_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          RAW_ARTIFACT_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          RAW_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          RAW_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
          RAW_ARTIFACT_REQUIRED: '1'
        run: npm run data:publish

      # After publishing, Jev labels the office and school pages that are new, changed or a
      # month past their last check, and flagged pages wait in an issue for a person. A
      # flagged page stays published until its skippedPages line is added. Without the
      # TYPESAFE_API_KEY secret nothing is sent; a run spends at most PAGE_CHECK_MAX_USD
      # (default $1).
      - name: Restore page check verdicts
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: data/review/page-check-verdicts.json
          key: page-check-${{ github.run_id }}
          restore-keys: page-check-

      - name: Check new and changed pages with Jev
        continue-on-error: true
        timeout-minutes: 45
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PAGE_CHECK_MAX_USD: ${{ vars.PAGE_CHECK_MAX_USD }}
        run: npm run check:pages

      - name: Save page check verdicts
        if: ${{ hashFiles('data/review/page-check-verdicts.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/review/page-check-verdicts.json
          key: page-check-${{ github.run_id }}

      - name: List flagged pages for review
        if: ${{ hashFiles('data/review/page-check.json') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          title='[Page check] Pages to review'
          issue_number="$(
            gh issue list \
              --repo "$REPOSITORY" \
              --state open \
              --label page-review \
              --limit 100 \
              --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" \
              | head -n 1
          )"
          flagged="$(jq '.flagged | length' data/review/page-check.json)"
          unjudged="$(jq '.unjudged' data/review/page-check.json)"
          if [[ "$flagged" == 0 ]]; then
            # Close only when every page has a verdict; missing verdicts are not a clean list.
            if [[ -n "$issue_number" && "$unjudged" == 0 ]]; then
              gh issue close "$issue_number" \
                --repo "$REPOSITORY" \
                --reason completed \
                --comment 'Every flagged page has been reviewed.'
            fi
            exit 0
          fi
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --repo "$REPOSITORY" --body-file data/review/page-check.md
          else
            gh label create page-review \
              --repo "$REPOSITORY" \
              --color FBCA04 \
              --description "Scraped pages Jev flagged for a person to review" \
              --force
            gh issue create \
              --repo "$REPOSITORY" \
              --title "$title" \
              --label page-review \
              --body-file data/review/page-check.md
          fi

      - name: Resolve data refresh incident
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          incident_number="$(
            gh issue list \
              --repo "$REPOSITORY" \
              --state open \
              --label data-refresh \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "[Data Refresh] Daily refresh failing") | .number' \
              | head -n 1
          )"
          if [[ -z "$incident_number" ]]; then
            exit 0
          fi
          recovery_body="$(
            printf 'The scheduled data refresh recovered successfully.\n\n- Successful run: %s\n- Recovered at: %s' \
              "$RUN_URL" \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          )"
          gh issue close "$incident_number" \
            --repo "$REPOSITORY" \
            --reason completed \
            --comment "$recovery_body"

      - name: Report data refresh failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER: ${{ github.event_name }}
        run: |
          gh label create data-refresh \
            --repo "$REPOSITORY" \
            --color B60205 \
            --description "Automated data collection or publication incident" \
            --force
          incident_number="$(
            gh issue list \
              --repo "$REPOSITORY" \
              --state open \
              --label data-refresh \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "[Data Refresh] Daily refresh failing") | .number' \
              | head -n 1
          )"
          incident_body="$(
            printf '@%s The scheduled RockyGPT data refresh failed or rejected stale/incomplete data.\n\n- Failed run: %s\n- Commit: `%s`\n- Trigger: `%s`\n- Observed at: %s\n\nThe previous active dataset remains available. Review the linked workflow logs before retrying or changing collection thresholds.' \
              "$REPOSITORY_OWNER" \
              "$RUN_URL" \
              "$COMMIT_SHA" \
              "$TRIGGER" \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          )"
          if [[ -n "$incident_number" ]]; then
            gh issue comment "$incident_number" \
              --repo "$REPOSITORY" \
              --body "$incident_body"
          else
            gh issue create \
              --repo "$REPOSITORY" \
              --title "[Data Refresh] Daily refresh failing" \
              --label data-refresh \
              --body "$incident_body"
          fi

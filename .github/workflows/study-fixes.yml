# Temporary, on this work branch only (never merged): checks and before/after runs for the
# 2026-11-18 blind-miss fixes. The Brain at BRAIN_REF reads the live graph file (read only). JOB
# picks the script in study-fixes/. Paid jobs are capped in the script (CAP_USD). Rows are committed
# back to this branch.
name: Study blind-miss fixes

on:
  push:
    branches: [claude/project-thread-fazqj0]
    paths: ['study-fixes/run.env']

permissions:
  contents: write

concurrency:
  group: study-fixes
  cancel-in-progress: false

jobs:
  study:
    name: Study
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v7
        with:
          path: data

      - name: Read the run settings
        run: cat data/study-fixes/run.env >> "$GITHUB_ENV"

      - name: Checkout the Brain
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: ${{ env.BRAIN_REF }}
          path: brain

      - name: Checkout the Brain before the fixes
        if: env.BEFORE_REF != ''
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: ${{ env.BEFORE_REF }}
          path: before

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the Brain
        run: |
          pip install --quiet --require-hashes -r brain/requirements.lock
          pip install --quiet --no-deps -e './brain[graph]'

      - name: Download the live graph (read only)
        env:
          BRAIN_GRAPH_STORE_PREFIX: ${{ env.GRAPH_PREFIX || 'brain-graph/' }}
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: python -m rockygpt_brain.retrieval.graph_sync .published > /dev/null

      - name: Run the job
        env:
          BRAIN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OUT_DIR: ${{ github.workspace }}/out
        run: |
          mkdir -p "$OUT_DIR"
          set -o pipefail
          python data/study-fixes/$JOB 2>&1 | grep -v '^provider_failure\|^brain_' | tee "$OUT_DIR/log.txt"

      - name: Run the job on the Brain before the fixes
        if: env.BEFORE_REF != ''
        env:
          BRAIN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OUT_DIR: ${{ github.workspace }}/out-before
        run: |
          pip install --quiet --no-deps -e './before[graph]'
          mkdir -p "$OUT_DIR"
          set -o pipefail
          python data/study-fixes/$JOB 2>&1 | grep -v '^provider_failure\|^brain_' | tee "$OUT_DIR/log.txt"

      - name: Commit the results to this branch
        if: always()
        run: |
          cd data
          dest="study-fixes/results/${RUN_NAME}"
          mkdir -p "$dest"
          cp -r "$GITHUB_WORKSPACE/out/." "$dest/" 2>/dev/null || true
          if [ -d "$GITHUB_WORKSPACE/out-before" ]; then
            mkdir -p "$dest/before"; cp -r "$GITHUB_WORKSPACE/out-before/." "$dest/before/"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add study-fixes/results
          git commit -m "Study rows: ${RUN_NAME}" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/project-thread-fazqj0 && git push origin HEAD:claude/project-thread-fazqj0 && break
            sleep $((i * 5))
          done

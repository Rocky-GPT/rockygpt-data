# Temporary, on this work branch only: reads the dev graph with the Brain's Answer Cards reader
# (rockygpt-brain branch claude/project-thread-gsatn5) and prints its counts and timing. It pays
# for nothing and writes nothing. Removed before this branch merges.
name: Check the Answer Cards reader on the dev graph

on:
  push:
    branches: [claude/project-thread-gsatn5]
    paths: ['.github/workflows/check-answer-cards.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the Brain
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: claude/project-thread-gsatn5
          path: brain

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the Brain
        run: |
          pip install --require-hashes -r brain/requirements.lock
          pip install --no-deps -e './brain[graph]'

      - name: Download the dev graph
        env:
          BRAIN_GRAPH_STORE_PREFIX: brain-graph-dev/
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: python -m rockygpt_brain.retrieval.graph_sync .published

      - name: Read the tasks
        run: |
          python - <<'EOF'
          import collections
          import json
          import time
          from pathlib import Path

          from rockygpt_brain.retrieval import answer_cards
          from rockygpt_brain.retrieval.graph_store import GraphOnlyFacts, read_pointer
          from rockygpt_brain.retrieval.meaning import MEANING_SUFFIX

          directory = Path(".published")
          pointer = read_pointer(directory)
          facts = GraphOnlyFacts(directory)
          start = time.perf_counter()
          found = answer_cards.listing(facts)
          first = time.perf_counter() - start
          start = time.perf_counter()
          again = answer_cards.listing(facts)
          second = time.perf_counter() - start
          body = json.dumps(found)
          print(f"release {found['dataset_version']}")
          print(f"listing: {first:.1f} s the first time, {second:.1f} s the second, "
                f"{len(body):,} bytes of JSON, same both times: {found == again}")
          print("totals:", found["totals"])
          print("nodes:", len(found["nodes"]),
                dict(collections.Counter(n["kind"] for n in found["nodes"])))

          meta = json.loads((directory / pointer["file"]).with_suffix(MEANING_SUFFIX).read_text())
          indexed = {(str(u[0]), str(u[1])) for u in meta["units"] if str(u[1]).startswith("e")}
          listed = {(p["record_id"], t["key"]) for p in found["pages"] for t in p["tasks"]}
          print(f"meaning index: {len(indexed)} tasks on {len({r for r, _ in indexed})} pages; "
                f"listed: {len(listed)} on {len(found['pages'])}; same tasks: {indexed == listed}")

          tasks = [t for p in found["pages"] for t in p["tasks"]]
          for field in ("applies_to", "handled_by", "term", "section"):
              print(f"tasks with {field}: {sum(1 for t in tasks if t.get(field))}")
          print("pages with a changed day:", sum(1 for p in found["pages"] if p["updated"]))
          print("pages by number of linking nodes:",
                dict(sorted(collections.Counter(len(p["nodes"]) for p in found["pages"]).items())))
          print("most tasks on one page:", max(len(p["tasks"]) for p in found["pages"]))
          print("ten nodes with the most tasks:")
          for node in sorted(found["nodes"], key=lambda n: -n["tasks"])[:10]:
              print(f"  {node['tasks']:5d} tasks on {node['pages']:4d} pages  "
                    f"{node['kind']:8s} {node['name']}")

          # One task opened, from the page with the most tasks, and from a parking page.
          biggest = max(found["pages"], key=lambda p: len(p["tasks"]))
          start = time.perf_counter()
          opened = answer_cards.task(facts, biggest["nodes"][0], biggest["record_id"],
                                     biggest["tasks"][0]["key"])
          print(f"one task opened in {time.perf_counter() - start:.2f} s "
                f"({len(json.dumps(opened)):,} bytes)")
          no_quote = 0
          steps = 0
          parking = [p for p in found["pages"] if "parking" in (p["path"] or "")]
          print(f"pages with 'parking' in the address: {len(parking)}, "
                f"{sum(len(p['tasks']) for p in parking)} tasks")
          sample = {"pages": parking[:8], "tasks": []}
          for page in parking[:8]:
              for item in page["tasks"][:3]:
                  one = answer_cards.task(facts, page["nodes"][0], page["record_id"], item["key"])
                  steps += len(one["task"]["steps"])
                  no_quote += sum(1 for s in one["task"]["steps"] if not s["quote"])
                  sample["tasks"].append(one)
          print(f"in the sample: {steps} steps, {no_quote} without the page's words")
          names = {n["entity_id"]: n for n in found["nodes"]}
          sample["nodes"] = [names[i] for i in sorted({i for p in parking[:8] for i in p["nodes"]})]
          print("SAMPLE-JSON " + json.dumps(sample, separators=(",", ":")))
          EOF

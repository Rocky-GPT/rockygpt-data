services:
  - type: web
    name: rockygpt-data-staging
    runtime: node
    plan: free
    branch: staging
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /readiness
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, sync: false }
      - { key: STAGING_SERVICE_TOKEN, sync: false }

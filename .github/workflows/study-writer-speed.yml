# Temporary, on this work branch only: one measurement for the overnight audit of 2026-11-17.
# It asks the Brain's real answer code 30 older how-to practice questions on the dev graph and
# times every model call from the inside (seconds to the model's first answer word, seconds in
# all, tokens read, thought and written), for today's production writer and for the sections
# writer at three thinking levels. Nothing in the bot changes and nothing is written anywhere.
# The script keeps its own spend cap (study/writer_speed.py, 60 cents). DRY=1 makes no model
# call at all. Removed before anything from this branch merges.
name: Study the writer speed

on:
  push:
    branches: [claude/project-thread-a2ch07]
    paths: ['.github/workflows/study-writer-speed.yml', 'study/**']

permissions:
  contents: read

concurrency:
  group: study-writer-speed
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout the Brain
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: dev
          path: brain

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the Brain
        run: |
          pip install --require-hashes -r brain/requirements.lock
          pip install --no-deps -e './brain[graph]'

      - name: Download the dev graph
        env:
          BRAIN_GRAPH_STORE_PREFIX: brain-graph-dev/
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: python -m rockygpt_brain.retrieval.graph_sync .published

      - name: Checkout this branch's test script
        uses: actions/checkout@v7
        with:
          path: data

      - name: Ask the 30 practice questions each way and time every model call
        env:
          BRAIN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY: '0'
        run: python data/study/writer_speed.py 2>&1 | grep -v '^provider_failure\|^brain_' 

name: OpenAPI Compatibility
on:
  pull_request:
    branches: [main, dev]
    paths: [api/openapi.yaml]
permissions:
  contents: read
  pull-requests: write
jobs:
  breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail on backward-incompatible API changes
        uses: oasdiff/oasdiff-action/breaking@v0.0.57
        with:
          base: https://raw.githubusercontent.com/Rocky-GPT/rockygpt-data/${{ github.event.pull_request.base.ref }}/api/openapi.yaml
          revision: api/openapi.yaml

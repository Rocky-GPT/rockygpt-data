# Temporary, on this work branch only: reads what the card match sees for 90 practice messages
# and 30 older how-to questions (with the clean questions the first read wrote for them in saved
# runs), on the dev graph. It writes nothing and makes no model call. Its one paid call embeds
# the texts (under a tenth of a cent a slice). Removed before this branch merges.
name: Study card upgrades on practice messages

on:
  push:
    branches: [claude/project-thread-gsatn5]
    paths: ['.github/workflows/study-card-upgrades.yml', 'study/**']

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        slice: [0, 1, 2, 3]
    steps:
      - name: Checkout the Brain
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: dev
          path: brain

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the Brain
        run: |
          pip install --require-hashes -r brain/requirements.lock
          pip install --no-deps -e './brain[graph]'

      - name: Download the dev graph
        env:
          BRAIN_GRAPH_STORE_PREFIX: brain-graph-dev/
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: python -m rockygpt_brain.retrieval.graph_sync .published

      - name: Checkout this branch's study script
        uses: actions/checkout@v7
        with:
          path: data

      - name: Read what the card match sees
        env:
          BRAIN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLICE: ${{ matrix.slice }}
        run: python data/study/explore_card_upgrades.py

# Temporary, on this work branch only: a paid measurement for the overnight audit of 2026-11-17.
# It asks the same 30 older how-to practice questions (not the frozen blind 60) twice each, one at
# a time, with the dev Brain's page answer at "low" thinking effort and with the audit's one-call
# writer over the Brain's own search, and times when the reply's first whole sentence has arrived
# from the model: what a student would wait for if answers were shown as they are written. It
# prints only timing summaries. Nothing in the bot changes and nothing is written anywhere. Each
# job keeps its own spend cap of 12 cents (about 8 cents expected in all). Removed before anything
# from this branch merges.
name: Study the answers after the fix

on:
  push:
    branches: [claude/project-thread-a2ch07]
    paths: ['.github/workflows/study-after-fix.yml', 'study2/**']

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Brain page answer at low effort, dev code, time to the first sentence
            ref: 959a8299d738761061100b0997d3b53fc7503545
            script: writer_tries.py
            arms: sections-low
          - name: One-call writer over the Brain's search, dev code, time to the first sentence
            ref: 959a8299d738761061100b0997d3b53fc7503545
            script: tiny_bot.py
            arms: tiny-read
    steps:
      - name: Checkout the Brain
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: ${{ matrix.ref }}
          path: brain

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the Brain
        run: |
          pip install --quiet --require-hashes -r brain/requirements.lock
          pip install --quiet --no-deps -e './brain[graph]'

      - name: Download the dev graph (read only)
        env:
          BRAIN_GRAPH_STORE_PREFIX: brain-graph-dev/
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: python -m rockygpt_brain.retrieval.graph_sync .published > /dev/null

      - name: Checkout this branch's test script
        uses: actions/checkout@v7
        with:
          path: data

      - name: Ask the 30 practice questions twice, one at a time
        env:
          BRAIN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY: '0'
          ARMS: ${{ matrix.arms }}
          TRIES: '2'
          AT_ONCE: '1'
          ROWS: '0'
          CAP_USD: '0.12'
          SCRIPT: ${{ matrix.script }}
        run: python "data/study2/$SCRIPT" 2>&1 | grep -v '^provider_failure\|^brain_'

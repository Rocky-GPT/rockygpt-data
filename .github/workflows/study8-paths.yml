# Temporary, on this work branch only: audit plan item 8 (2026-11-17), approved with the plan.
# The read with its new topic, on the 224 practice messages (never the frozen blind set), three
# votes each, capped at $0.30. Rows are committed to this branch. Removed before any merge.
name: Study 8 read paths

on:
  push:
    branches: [claude/project-thread-ywfxp0]
    paths: ['.github/workflows/study8-paths.yml', 'study8/paths.py']

permissions:
  contents: write

concurrency:
  group: study8-paths
  cancel-in-progress: false

jobs:
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the Brain work branch
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: claude/project-thread-ywfxp0
          path: brain
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install the Brain
        run: |
          pip install --quiet --require-hashes -r brain/requirements.lock
          pip install --quiet --no-deps -e './brain[graph]'
      - name: Download the live graph (read only)
        env:
          BRAIN_GRAPH_STORE_PREFIX: brain-graph/
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: python -m rockygpt_brain.retrieval.graph_sync .published > /dev/null
      - name: Checkout this branch
        uses: actions/checkout@v7
        with:
          path: data
      - name: Read the 224 practice messages
        env:
          BRAIN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CAP_USD: '0.30'
          OUT: ${{ github.workspace }}/paths.json
        run: set -o pipefail; python data/study8/paths.py 2>&1 | grep -v '^provider_failure\|^brain_'
      - name: Commit the rows to this branch
        if: always()
        run: |
          cd data
          mkdir -p study8/results
          cp "$GITHUB_WORKSPACE/paths.json" study8/results/ || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add study8/results
          git commit -m "Study rows: item 8 read paths"
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/project-thread-ywfxp0 && git push origin HEAD:claude/project-thread-ywfxp0 && break
            sleep $((i * 5))
          done

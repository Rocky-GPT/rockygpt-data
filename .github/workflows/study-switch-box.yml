# Temporary, on this work branch only: a free measurement for the overnight audit of 2026-11-17.
# When the nightly data arrives, the live Brain reads the new release in a second engine while the
# first keeps answering, so for a while it holds two. The live box has 512 MB. This builds the
# Brain's own image (live code, and dev code with both fixes), gives each a box of that size and
# lets the Brain's own release code switch to a second copy of its release, twice: once with
# nobody asking and once with two students asking all the time (a stand-in answers for the model,
# so it costs nothing). It prints the memory held before, during and after, and whether the box
# ran out. It reads graph files from the file store and writes nothing anywhere but its own
# scratch copies. Removed before anything from this branch merges.
name: Study the release switch

on:
  push:
    branches: [claude/project-thread-a2ch07]
    paths: ['.github/workflows/study-switch-box.yml', 'study3/**']

permissions:
  contents: read

jobs:
  box:
    name: Release switch in a 512 MB box
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the dev Brain (both fixes)
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: 959a8299d738761061100b0997d3b53fc7503545
          path: brain-dev
      - name: Checkout the live Brain
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: main
          path: brain-main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the Brain
        run: |
          pip install --quiet --require-hashes -r brain-dev/requirements.lock
          pip install --quiet --no-deps -e './brain-dev[graph]'

      - name: Download the dev and live graph files (read only)
        env:
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          BRAIN_GRAPH_STORE_PREFIX=brain-graph-dev/ python -m rockygpt_brain.retrieval.graph_sync .graph-dev > /dev/null
          BRAIN_GRAPH_STORE_PREFIX=brain-graph/ python -m rockygpt_brain.retrieval.graph_sync .graph-live > /dev/null

      - name: Checkout this branch's test script
        uses: actions/checkout@v7
        with:
          path: data

      - name: Build the Brain's own image at each commit
        run: |
          docker build --quiet -t box-dev brain-dev
          docker build --quiet -t box-main brain-main

      - name: Switch releases in a 512 MB, half-processor box, case by case
        run: |
          set +e
          run_case() {  # name image graph writer asking mode
            rm -rf sw && cp -r "$3" sw && chmod -R u+w sw
            GRAPH_DIR=sw WORK_DIR=sw PREPARE_ONLY=1 python data/study3/switch_box.py > /dev/null 2>&1
            chmod -R a+rwX sw
            docker rm -f box > /dev/null 2>&1
            docker run --name box --memory=512m --memory-swap=512m --cpus=0.5 \
              -e WRITER="$4" -e BRAIN_REF="$2" -e AT_ONCE="$5" -e MODE="$6" -e BEFORE=30 -e SWITCHES=2 \
              -e GRAPH_DIR=/graph -e WORK_DIR=/graph \
              -v "$PWD/sw:/graph" -v "$PWD/data/study3:/study:ro" \
              "$2" python /study/switch_box.py > "out-$1.txt" 2>&1
            docker inspect box --format 'BOX RESULT: ran out of memory {{.State.OOMKilled}}; exit code {{.State.ExitCode}}' >> "out-$1.txt"
          }
          # Today's way (a second engine beside the first) and the fix being tried (pause, drop, read).
          run_case 1-live-two-asking-today box-main .graph-live ai 2 double
          run_case 2-dev-two-asking-today box-dev .graph-dev sections 2 double
          run_case 3-dev-one-asking-today box-dev .graph-dev sections 1 double
          run_case 4-dev-two-asking-pause box-dev .graph-dev sections 2 pause
          run_case 5-live-two-asking-pause box-main .graph-live ai 2 pause
          run_case 6-dev-four-asking-pause box-dev .graph-dev sections 4 pause
          run_case 7-dev-two-asking-today-again box-dev .graph-dev sections 2 double
          echo "SUMMARY START"
          for f in out-*.txt; do
            echo "CASE $f"
            grep -E "^release|^after warm|^BEFORE|^PAUSE|^SWITCH|^AFTER|^FINISHED|^BOX RESULT|Traceback|^[A-Za-z]*Error" "$f" | cut -c1-520
          done
          echo "SUMMARY END"
          exit 0

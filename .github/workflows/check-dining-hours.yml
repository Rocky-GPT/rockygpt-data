name: Check the dining hours reader

# TEMPORARY, on this branch only: the dining hours reader failed in production on a "More hours"
# button it could not click, and a dev build runs no collector. This loads Sodexo's hours page
# once to describe it, then runs the reader once. It fetches no ramapo.edu page and publishes nothing.
on:
  push:
    branches: [claude/project-thread-gsatn5]
    paths:
      - '.github/workflows/check-dining-hours.yml'
      - 'scripts/review/dining-hours-page.ts'
      - 'ingestion/dining-hours.ts'
      - 'ingestion/dining-rendered.ts'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Describe the page's "More hours" buttons
        run: npx tsx scripts/review/dining-hours-page.ts
      - name: Run the dining hours reader
        if: ${{ always() }}
        run: |
          npm run fetch:dining-hours
          echo '== What the reader kept from the rendered page =='
          node -e "const r=require('./data/raw/dining-hours-rendered.raw.json');for(const v of r.venues)console.log(v.name+': '+(v.regular.map(g=>g.days+' = '+g.hours.join(', ')).join(' | ')||'(no regular hours read)'))"

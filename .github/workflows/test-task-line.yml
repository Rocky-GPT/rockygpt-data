# Temporary, on this work branch only: the 5-cent test Dan approved on 2026-11-16. It runs the
# Brain's real first read on practice messages, as it is and with one more field (the student's
# task as a plain "How do I ...?" line), and matches the lines to the answer cards on the dev
# graph. Nothing in the bot changes and nothing is written anywhere. The script keeps its own
# spend cap (study/test_task_line.py). DRY=1 makes no model call at all.
# Removed before this branch merges.
name: Test the plain task line

on:
  push:
    branches: [claude/project-thread-gsatn5]
    paths: ['.github/workflows/test-task-line.yml', 'study/**']

permissions:
  contents: read

concurrency:
  group: test-task-line
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the Brain
        uses: actions/checkout@v7
        with:
          repository: Rocky-GPT/rockygpt-brain
          ref: dev
          path: brain

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the Brain
        run: |
          pip install --require-hashes -r brain/requirements.lock
          pip install --no-deps -e './brain[graph]'

      - name: Download the dev graph
        env:
          BRAIN_GRAPH_STORE_PREFIX: brain-graph-dev/
          BRAIN_GRAPH_STORE_BUCKET: ${{ vars.RAW_ARTIFACT_BUCKET }}
          BRAIN_GRAPH_STORE_REGION: ${{ vars.RAW_ARTIFACT_REGION }}
          BRAIN_GRAPH_STORE_ENDPOINT: ${{ vars.RAW_ARTIFACT_ENDPOINT }}
          BRAIN_GRAPH_STORE_ACCESS_KEY_ID: ${{ secrets.RAW_ARTIFACT_ACCESS_KEY_ID }}
          BRAIN_GRAPH_STORE_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARTIFACT_SECRET_ACCESS_KEY }}
        run: python -m rockygpt_brain.retrieval.graph_sync .published

      - name: Checkout this branch's test script
        uses: actions/checkout@v7
        with:
          path: data

      - name: Read the messages both ways and match the task lines to the cards
        env:
          BRAIN_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY: '0'
        run: python data/study/test_task_line.py

      - name: Keep the numbers for the jobs that print them
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: task-line-test
          path: out/
          retention-days: 1
          if-no-files-found: warn

  show:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2]
    steps:
      - name: Download the numbers
        uses: actions/download-artifact@v4
        with:
          name: task-line-test
          path: out

      - name: Print one part
        run: cat out/part-${{ matrix.part }}.txt
